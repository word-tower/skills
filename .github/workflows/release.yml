name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build client packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m unittest discover -s tests -q
          python3 scripts/build.py --check
          python3 - <<'PYTHON'
          import os
          from scripts.build import version
          if os.environ['RELEASE_TAG'] != 'v' + version():
              raise SystemExit('Release tag must match the Skill version')
          PYTHON
          python3 scripts/build.py --all
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          词塔 WordTower

          Assets 包含普通 Skill、WorkBuddy MCP 连接器、Claude Code 插件和 Codex 安装材料。
          各渠道共用 Skill 脚本与领域文档；按客户端选择一个包，安装与 Key 配置见仓库 README。

          通用安装：npx skills add word-tower/skills -g
          Claude Code：添加 word-tower/skills 插件市场，安装 wordtower@wordtower。
          WorkBuddy ZIP 需在连接器平台审核发布，不会随 GitHub Release 自动上架。

          权限、额度及可用操作以服务端实时返回为准。包内不包含用户 Key 或后端服务代码。
          NOTES
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "WordTower ${RELEASE_TAG}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip --clobber
